<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#edf3f9">
<title>Desafio | PGrowth Fitness</title>
<style>
:root{
  --blue:#1769aa;
  --deep:#103c65;
  --silver:#dce6f0;
  --ink:#17334d;
  --muted:#687f94;
  --line:rgba(60,100,140,.15);
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  color:var(--ink);
  font-family:Inter,system-ui,-apple-system,sans-serif;
  background:linear-gradient(145deg,#f8fbff,#e7eef6 55%,#f5f8fc);
}
.page{width:min(760px,100%);margin:auto;padding:20px 16px 55px}
.back{
  display:inline-flex;
  text-decoration:none;
  color:#315b7d;
  font-size:12px;
  font-weight:850;
  padding:11px 14px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#ffffffc9;
}
.eyebrow{
  display:block;
  margin:25px 3px 12px;
  color:#47708f;
  font-size:10px;
  font-weight:950;
  letter-spacing:.16em;
}
.detail-hero{
  padding:25px 21px;
  border-radius:24px;
  background:linear-gradient(125deg,#0d3458,#1769aa 70%,#83a9cc);
  color:white;
  box-shadow:0 15px 36px #174c772b;
}
.detail-hero.completed{
  background:linear-gradient(125deg,#14533c,#23845b 70%,#76bd94);
}
.detail-symbol{
  display:inline-grid;
  place-items:center;
  min-width:65px;
  height:48px;
  padding:0 12px;
  border-radius:14px;
  background:#ffffff20;
  font-size:13px;
  font-weight:950;
  margin-right:8px;
}
.tag{
  display:inline-block;
  vertical-align:middle;
  padding:7px 11px;
  border-radius:30px;
  background:#ffffff20;
  color:white;
  font-size:10px;
  font-weight:850;
  text-transform:uppercase;
}
.detail-hero h1{
  font-size:clamp(25px,6vw,38px);
  line-height:1.12;
  margin:22px 0 8px;
}
.detail-hero>p{
  color:#e1effb;
  font-size:13px;
  line-height:1.6;
}
.detail-progress-line{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:10px;
  margin:25px 0 9px;
}
.detail-progress-line strong{font-size:26px}
.detail-progress-line small{font-size:12px;font-weight:600}
.detail-progress-line span{font-size:15px;font-weight:900}
.progress{
  height:10px;
  border-radius:20px;
  overflow:hidden;
  background:#ffffff38;
}
.progress span{
  display:block;
  height:100%;
  border-radius:20px;
  background:linear-gradient(90deg,#b5dcff,#fff);
}
.completed .progress span{background:#b7f1cc}
.detail-state{
  margin:12px 0 0;
  font-size:10px;
  font-weight:900;
  letter-spacing:.08em;
}
.detail-panel{
  margin-top:14px;
  padding:19px;
  border:1px solid white;
  border-radius:19px;
  background:#ffffffd9;
  box-shadow:0 8px 23px #234c7010;
}
.detail-panel h2{
  margin:0 0 7px;
  color:var(--deep);
  font-size:17px;
}
.detail-panel>p{
  color:var(--muted);
  font-size:12px;
  line-height:1.6;
}
.detail-form{display:flex;gap:8px;margin-top:14px}
.detail-form input{
  width:100%;
  min-width:0;
  border:1px solid #d6e1eb;
  border-radius:11px;
  background:white;
  padding:13px;
  color:var(--ink);
  font-size:14px;
}
.detail-form button,.reset-button{
  border:0;
  border-radius:11px;
  background:var(--deep);
  color:white;
  font-size:10px;
  font-weight:900;
  padding:0 14px;
  white-space:nowrap;
}
.detail-link{
  display:inline-block;
  margin-top:10px;
  color:var(--deep);
  font-size:11px;
  font-weight:900;
  text-decoration:none;
}
.record-list{display:grid;gap:9px;margin-top:13px}
.record{
  display:grid;
  gap:5px;
  padding:12px;
  border-radius:12px;
  background:#edf3f9;
}
.record strong{font-size:12px;color:var(--deep)}
.record span{font-size:10px;color:var(--muted)}
.empty-detail{padding:13px;background:#edf3f9;border-radius:12px}
.reset-button{
  min-height:42px;
  background:#9b5960;
  margin-top:8px;
}
.sync-note{
  margin:17px 3px 0;
  color:var(--muted);
  font-size:10px;
  line-height:1.5;
}
.toast{
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  background:#123e63;
  color:white;
  padding:12px 17px;
  border-radius:12px;
  font-size:12px;
  box-shadow:0 8px 25px #102f4c40;
  transition:.2s;
  z-index:20;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:420px){
  .detail-form{flex-direction:column}
  .detail-form button{min-height:43px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{transition:none!important}
}

/* PGrowth Fitness - guias dos desafios */
.challenge-guide{overflow:hidden}
.guide-kicker{font-size:9px;font-weight:950;letter-spacing:.13em;color:#5480a3}
.challenge-guide>h2{margin-top:9px}
.guide-image{display:block;width:100%;max-height:280px;object-fit:cover;border-radius:15px;margin:15px 0}
.guide-meta{display:flex;justify-content:space-between;gap:12px;padding:13px 15px;border-radius:12px;background:#edf4fb;margin:12px 0 20px}
.guide-meta span{font-size:9px;font-weight:900;color:#607d96}
.guide-meta strong{font-size:14px;color:#1769aa}
.challenge-guide h3{font-size:14px;color:var(--deep);margin:18px 0 10px}
.guide-steps{padding-left:23px;display:grid;gap:10px}
.guide-steps li{padding-left:5px;color:#405c74;font-size:12px;line-height:1.65}
.guide-tip,.guide-safety{padding:14px;border-radius:13px;margin-top:14px}
.guide-tip{background:#eaf4ff;border:1px solid #d8eaff}
.guide-safety{background:#fff4e9;border:1px solid #f5e4ce}
.guide-tip strong,.guide-safety strong{font-size:9px;letter-spacing:.09em}
.guide-tip p,.guide-safety p{font-size:12px;line-height:1.6;color:#526a7e;margin:7px 0 0}
.guide-video-area{margin-top:17px}
.video-placeholder{min-height:145px;padding:22px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:1px dashed #b9cbdc;border-radius:15px;background:#edf3f9}
.video-symbol{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:#1769aa;color:white;font-size:17px;margin-bottom:10px}
.video-placeholder strong{font-size:13px;color:#244d70}
.video-placeholder p{font-size:11px;line-height:1.5;color:#647e94;margin:7px 0}
.video-placeholder small{font-size:9px;color:#8295a7}
.guide-video-player{display:block;width:100%;max-height:420px;border-radius:15px;background:#101820}
@media(max-width:420px){.guide-image{max-height:220px}.guide-meta{flex-direction:column;gap:5px}}

</style>
</head>
<body>
<main class="page">
  <a class="back" href="desafios.html">← VOLTAR AOS DESAFIOS</a>
  <a class="back" href="index.html">← PAINEL PRINCIPAL</a>
  <span class="eyebrow">PGROWTH FITNESS · PERFORMANCE</span>
  <div id="challenge-detail">
    <section class="detail-panel">
      <h2>A carregar desafio...</h2>
      <p>A preparar o teu progresso e histórico.</p>
    </section>
  </div>
  <p class="sync-note" id="sync-status">Os teus dados são guardados neste dispositivo e sincronizados com a tua conta quando possível.</p>
</main>
<div class="toast" id="toast" role="status"></div>
<script src="js/session.js"></script>
<script src="js/desafio-guias.js"></script>
<script src="js/desafios.js"></script>
</body>
</html>
